[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "morphiq-sdk"
# Release Please manages this version through reviewed release PRs.
version = "0.1.0.dev0"
description = "Python SDK for the MorphIQ Labs API"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "MorphIQ Labs" }]
dependencies = ["httpx>=0.28.1,<0.29", "pydantic>=2.10,<3"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Private :: Do Not Upload",
  "Programming Language :: Python :: 3",
  "Typing :: Typed",
]

[project.urls]
Repository = "https://github.com/MorphIQ-Labs/morphiq-sdk-python"

[project.optional-dependencies]
# yfinance 1.7 uses inplace methods deprecated in pandas 3.1.
notebooks = ["jupyterlab>=4.6,<5", "ipykernel>=7.4,<8", "yfinance>=1.7,<2", "pandas>=2.2,<3.1", "ipywidgets>=8.1,<9", "matplotlib>=3.10,<4", "voila>=0.5.13,<0.6"]
market-data = ["yfinance>=1.7,<2", "pandas>=2.2,<3.1"]

[tool.hatch.build.targets.wheel]
packages = ["src/morphiq_sdk"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/pyproject.toml", "/README.md", "/examples", "/notebooks"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "scripts", "examples", "docker"]

[[tool.mypy.overrides]]
module = ["nbformat", "nbformat.*", "nbclient", "nbclient.*", "yfinance", "yfinance.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires an explicitly configured controlled API endpoint"]
