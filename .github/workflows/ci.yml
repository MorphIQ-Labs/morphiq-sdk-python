name: SDK checks

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  conventional-title:
    name: Conventional PR title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check conventional commit title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        shell: bash
        run: |
          pattern='^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([A-Za-z0-9._/-]+\))?!?: .+'
          if [[ ! "$PR_TITLE" =~ $pattern ]]; then
            echo 'Use a conventional commit PR title, for example feat(client): add pricing.'
            exit 1
          fi

  package:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install pinned development tools and SDK
        run: |
          python -m pip install --require-hashes -r requirements-dev.txt
          python -m pip install --no-build-isolation -e .
      - name: Verify package, release proposal and tag versions
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: python scripts/check_release_version.py
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m mypy
      - run: python scripts/generate_notebook.py --check
      - run: python -m pytest -q
      - run: python scripts/check_package.py

  notebook-container:
    name: Docker notebook
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: docker compose config --quiet
      - run: docker build -t morphiq-sdk-notebook:test .
      - run: python3 scripts/check_notebook_container.py --image morphiq-sdk-notebook:test
