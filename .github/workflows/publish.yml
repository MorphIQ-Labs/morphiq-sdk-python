name: Publish SDK package

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing Release Please tag (vX.Y.Z); run from main
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: sdk-package-publication
  cancel-in-progress: false

jobs:
  preflight:
    # Deliberately unset until ownership, licensing and protected environments are ready.
    if: >-
      vars.PYPI_PUBLISHING_ENABLED == 'true' &&
      (github.event_name == 'release' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      commit: ${{ steps.check.outputs.commit }}
      tag: ${{ steps.check.outputs.tag }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check release identity and both environment protections
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: python3 scripts/check_publish.py preflight --tag "$RELEASE_TAG" --repository "$GITHUB_REPOSITORY"

  build:
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.preflight.outputs.commit }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'
      - name: Check the tagged source
        run: |
          python -m pip install --require-hashes -r requirements-dev.txt
          python -m pip install --no-build-isolation -e .
          python scripts/check_release_version.py
          python -m ruff check .
          python -m ruff format --check .
          python -m mypy
          python scripts/generate_notebook.py --check
          python -m pytest -q
      - name: Build sdist, then wheel from that sdist; record identities and hashes
        env:
          RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
        run: |
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          export SOURCE_DATE_EPOCH
          python -m build --outdir dist
          python scripts/check_publish.py artifacts --tag "$RELEASE_TAG"
          cat release-artifacts.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-artifacts
          path: |
            dist/
            release-artifacts.json
          if-no-files-found: error
          retention-days: 90

  verify-build:
    needs: [preflight, build]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.preflight.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-artifacts
      - name: Verify exact build and install core plus all extras in a clean environment
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          python scripts/check_publish.py local
          python scripts/check_published_install.py --wheel "dist/morphiq_sdk-${VERSION}-py3-none-any.whl" --version "$VERSION"

  testpypi:
    needs: [preflight, verify-build]
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/morphiq-sdk
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.preflight.outputs.commit }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-artifacts
      - name: Reject conflicts; stage only files not already published
        id: pending
        run: python3 scripts/check_publish.py pending --index testpypi --destination upload
      - name: Publish to TestPyPI with OIDC and attestations
        if: steps.pending.outputs.count != '0'
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: upload/
          attestations: true

  verify-testpypi:
    needs: [preflight, testpypi]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.preflight.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-artifacts
      - name: Download exact published files; install with dependencies from PyPI
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          python scripts/check_publish.py index --index testpypi --destination downloaded
          python scripts/check_published_install.py --wheel "downloaded/morphiq_sdk-${VERSION}-py3-none-any.whl" --version "$VERSION"

  pypi:
    needs: [preflight, verify-testpypi]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/morphiq-sdk
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.preflight.outputs.commit }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-artifacts
      - name: Reject conflicts; stage the same tested files for production
        id: pending
        run: python3 scripts/check_publish.py pending --index pypi --destination upload
      - name: Publish to PyPI with OIDC and attestations
        if: steps.pending.outputs.count != '0'
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        with:
          packages-dir: upload/
          attestations: true

  verify-pypi:
    needs: [preflight, pypi]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.preflight.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-artifacts
      - name: Verify the public wheel and sdist and their clean installation
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          python scripts/check_publish.py index --index pypi --destination downloaded
          python scripts/check_published_install.py --wheel "downloaded/morphiq_sdk-${VERSION}-py3-none-any.whl" --version "$VERSION"
